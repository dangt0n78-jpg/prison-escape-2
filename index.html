<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prison Escape: Solid Light</title>
    <style>
        body {
            margin: 0; background-color: #0f172a; color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        canvas {
            background-color: #1e293b; border: 4px solid #334155; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); cursor: crosshair;
        }
        #ui-panel { width: 800px; display: flex; justify-content: space-between; margin-bottom: 15px; }
        .box { background: #1e293b; padding: 10px 20px; border: 2px solid #334155; border-radius: 6px; }
        kbd { background: #334155; padding: 3px 6px; border-radius: 4px; font-family: monospace; color: #38bdf8; }
        .text-blue { color: #38bdf8; font-weight: bold; }
        .text-green { color: #4ade80; font-weight: bold; }
        .text-red { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="box">
            <div style="font-size: 12px; color: #94a3b8;">GÓC KÍNH CỦA BẠN</div>
            <div style="font-size: 24px;" class="text-blue"><span id="glasses-angle">0</span>°</div>
        </div>
        <div class="box" style="text-align: right;">
            <div style="font-size: 12px; color: #94a3b8;">TRẠNG THÁI CẦU ÁNH SÁNG</div>
            <div style="font-size: 24px;" id="bridge-state" class="text-red">Xuyên thấu (Ảo)</div>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div style="margin-top: 15px; color: #94a3b8; text-align: center; line-height: 1.6;">
        Di chuyển: <kbd>A</kbd> <kbd>D</kbd> | Nhảy: <kbd>W</kbd> | Xoay kính: <kbd>Q</kbd> / <kbd>E</kbd><br>
        1. <b>Click đèn pha</b> để dán phim phân cực 45°. Xoay kính <b style="color:#fff">135°</b> để xóa mù và nhảy qua gai.<br>
        2. Tới vực thẳm, xoay kính về <b style="color:#fff">0°</b> để biến tia Laser thành cây cầu rắn chắc!
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiGlassesAngle = document.getElementById('glasses-angle');
        const uiBridgeState = document.getElementById('bridge-state');

        // Input
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // State
        let glassesAngle = 0;
        let isLightPolarized = false;
        let gameState = 'playing'; // playing, dead, win
        let lastTime = 0;

        // Player physics
        const player = { x: 50, y: 350, w: 30, h: 40, vx: 0, vy: 0, speed: 300, jumpPower: -550, gravity: 1200, grounded: false };

        // Level Design
        const platforms = [
            { x: 0, y: 450, w: 270, h: 50 },     // Bờ bên trái
            { x: 370, y: 450, w: 100, h: 50 },   // Đảo ở giữa (safe zone)
            { x: 700, y: 350, w: 100, h: 150 }   // Bờ bên phải (lối thoát)
        ];
        
        const spikes = [
            { x: 270, y: 435, w: 100, h: 15 }    // Hố gai (đã thu hẹp để dễ nhảy)
        ];

        const exitDoor = { x: 740, y: 250, w: 50, h: 100 };
        const lightSource = { x: 310, y: 50, radius: 30 }; // Đèn pha gây chói

        // Cây cầu ánh sáng (Solid Light Mechanic)
        const lightBridge = { x: 470, y: 350, w: 230, h: 10, angle: 0 };
        let isBridgeSolid = false;

        // Tương tác click chuột vào đèn
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            if (Math.hypot(mouseX - lightSource.x, mouseY - lightSource.y) < lightSource.radius + 20) {
                isLightPolarized = true;
            }
        });

        function reset() {
            player.x = 50; player.y = 350; player.vx = 0; player.vy = 0;
            isLightPolarized = false;
            glassesAngle = 0;
            gameState = 'playing';
        }

        // Logic cập nhật
        function update(delta) {
            if (gameState !== 'playing') {
                if (keys['Space']) reset();
                return;
            }

            // 1. Điều khiển xoay kính
            if (keys['KeyQ']) glassesAngle -= 150 * delta;
            if (keys['KeyE']) glassesAngle += 150 * delta;
            if (glassesAngle < 0) glassesAngle += 180;
            if (glassesAngle >= 180) glassesAngle -= 180;
            uiGlassesAngle.innerText = Math.round(glassesAngle);

            // 2. Tính toán Cầu Ánh Sáng
            // Định luật Malus: Intensity = cos^2(delta_angle). Nếu cường độ > 95%, cầu sẽ cứng lại!
            const bridgeAngleDiff = (glassesAngle - lightBridge.angle) * Math.PI / 180;
            const bridgeIntensity = Math.pow(Math.cos(bridgeAngleDiff), 2);
            
            isBridgeSolid = (bridgeIntensity > 0.95);
            if (isBridgeSolid) {
                uiBridgeState.innerText = "Đã hóa Rắn!";
                uiBridgeState.className = "text-green";
            } else {
                uiBridgeState.innerText = "Xuyên thấu (Ảo)";
                uiBridgeState.className = "text-red";
            }

            // 3. Di chuyển người chơi
            player.vx = 0;
            if (keys['KeyA']) player.vx = -player.speed;
            if (keys['KeyD']) player.vx = player.speed;

            // Nhảy
            if (keys['KeyW'] && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            // Áp dụng trọng lực
            player.vy += player.gravity * delta;
            
            // Lấy vị trí Y cũ để check va chạm bề mặt từ trên xuống
            let prevY = player.y; 
            
            player.x += player.vx * delta;
            player.y += player.vy * delta;

            // Ranh giới màn hình
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

            // 4. Xử lý Va chạm với sàn đá
            player.grounded = false;
            platforms.forEach(p => {
                if (player.x + player.w > p.x && player.x < p.x + p.w) {
                    // Chạm sàn từ trên xuống
                    if (player.vy >= 0 && prevY + player.h <= p.y && player.y + player.h >= p.y) {
                        player.y = p.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                    }
                }
            });

            // 5. Xử lý Va chạm với Cầu Ánh Sáng (Chỉ hoạt động khi isBridgeSolid = true)
            if (isBridgeSolid && player.vy >= 0) {
                if (player.x + player.w > lightBridge.x && player.x < lightBridge.x + lightBridge.w) {
                    // Nếu rơi trúng cầu
                    if (prevY + player.h <= lightBridge.y && player.y + player.h >= lightBridge.y) {
                        player.y = lightBridge.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                    }
                }
            }

            // 6. Kiểm tra Chết (Rớt hố hoặc chạm gai)
            if (player.y > canvas.height) gameState = 'dead';
            
            spikes.forEach(s => {
                if (player.x < s.x + s.w && player.x + player.w > s.x &&
                    player.y < s.y + s.h && player.y + player.h > s.y) {
                    gameState = 'dead';
                }
            });

            // 7. Kiểm tra Thắng
            if (player.x < exitDoor.x + exitDoor.w && player.x + player.w > exitDoor.x &&
                player.y < exitDoor.y + exitDoor.h && player.y + player.h > exitDoor.y) {
                gameState = 'win';
            }
        }

        // Vẽ đồ họa
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ Platforms (Đảo đá)
            ctx.fillStyle = '#334155';
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

            // Vẽ Cửa thoát hiểm
            ctx.fillStyle = '#16a34a'; ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);
            ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.fillText("EXIT", exitDoor.x + 10, exitDoor.y + 50);

            // Vẽ Bẫy Gai
            ctx.fillStyle = '#ef4444';
            spikes.forEach(s => {
                for (let i = 0; i < s.w; i += 20) {
                    ctx.beginPath();
                    ctx.moveTo(s.x + i, s.y + s.h);
                    ctx.lineTo(s.x + i + 10, s.y);
                    ctx.lineTo(s.x + i + 20, s.y + s.h);
                    ctx.fill();
                }
            });

            // Vẽ Máy phát Cầu Ánh Sáng
            ctx.fillStyle = '#64748b';
            ctx.fillRect(lightBridge.x - 20, lightBridge.y - 15, 20, 30); // Cục Emitter
            
            // Vẽ Cầu Ánh Sáng
            if (isBridgeSolid) {
                // Trạng thái Rắn (Phát sáng mạnh)
                ctx.shadowBlur = 20; ctx.shadowColor = '#38bdf8';
                ctx.fillStyle = '#bae6fd';
                ctx.fillRect(lightBridge.x, lightBridge.y, lightBridge.w, lightBridge.h);
                ctx.shadowBlur = 0;
            } else {
                // Trạng thái Ảo (Mờ ảo)
                ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
                ctx.fillRect(lightBridge.x, lightBridge.y, lightBridge.w, lightBridge.h);
            }

            // Vẽ Player
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // === HỆ THỐNG ĐÈN PHA CHÓI MẮT ===
            let lightIntensity = 1.0;
            if (isLightPolarized) {
                const angleDiff = (glassesAngle - 45) * Math.PI / 180;
                lightIntensity = Math.pow(Math.cos(angleDiff), 2);
            }

            if (lightIntensity > 0.05) {
                const gradient = ctx.createLinearGradient(0, lightSource.y, 0, 450);
                gradient.addColorStop(0, `rgba(253, 224, 71, ${lightIntensity * 0.9})`);
                gradient.addColorStop(1, `rgba(253, 224, 71, ${lightIntensity * 1.0})`);
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.moveTo(lightSource.x, lightSource.y);
                ctx.lineTo(150, 450); 
                ctx.lineTo(400, 450);
                ctx.fill();
            }

            // Vẽ cục đèn pha
            ctx.fillStyle = isLightPolarized ? '#4ade80' : '#facc15';
            ctx.beginPath(); ctx.arc(lightSource.x, lightSource.y, lightSource.radius, 0, Math.PI * 2); ctx.fill();
            
            if (isLightPolarized) {
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath();
                const rad = 45 * Math.PI / 180;
                ctx.moveTo(lightSource.x - Math.cos(rad)*25, lightSource.y - Math.sin(rad)*25);
                ctx.lineTo(lightSource.x + Math.cos(rad)*25, lightSource.y + Math.sin(rad)*25);
                ctx.stroke();
            }

            // UI Chết / Thắng
            if (gameState !== 'playing') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = gameState === 'win' ? '#4ade80' : '#ef4444';
                ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(gameState === 'win' ? 'ESCAPED!' : 'YOU DIED!', canvas.width/2, 250);
                ctx.font = '20px sans-serif'; ctx.fillStyle = '#fff';
                ctx.fillText('Nhấn SPACE để chơi lại', canvas.width/2, 300);
            }
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const delta = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            update(delta);
            render();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
